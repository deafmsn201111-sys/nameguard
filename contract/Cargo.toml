[package]
name = "nameguard"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.0.0"

[dev-dependencies]
near-sdk = { version = "5.0.0", features = ["unit-testing"] }

[features]
default = []
unit-testing = ["near-sdk/unit-testing"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"